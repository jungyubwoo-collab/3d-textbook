name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: textbook
          POSTGRES_PASSWORD: textbook
          POSTGRES_DB: textbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U textbook -d textbook"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://textbook:textbook@localhost:5432/textbook?schema=public
      # 설정되어 있으면 API의 PostgreSQL 통합 테스트도 실행된다.
      TEST_DATABASE_URL: postgresql://textbook:textbook@localhost:5432/textbook?schema=public
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Apply database migrations
        run: npm run db:deploy
      - run: npm test
      - run: npm run build
